name: CodeGuessr CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tests and Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/pyproject.toml
      - name: Run backend tests
        run: |
          python -m pip install -e './Backend[dev]'
          python -m pytest -q Backend/tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Test and build frontend
        working-directory: Frontend
        run: |
          npm ci
          node --test tests/*.test.js
          npm run build
      - name: Validate local Docker Compose configuration
        run: docker compose config --quiet
      - name: Start complete application and smoke test
        run: |
          docker compose up -d --build --wait
          # The locally generated Caddy certificate is not publicly trusted.
          curl --insecure --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors https://localhost/api/ping
          curl --insecure --fail --silent --show-error https://localhost/api/health/ready
          curl --insecure --fail --silent --show-error https://localhost/api/map > /dev/null
          curl --insecure --fail --silent --show-error https://localhost/ | grep -qi '<html'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down test application
        if: always()
        run: docker compose down -v

  build:
    name: Ansible build and Docker Hub push
    needs: check
    # Secrets are NEVER used for PRs originating from forks.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and Docker collection
        run: |
          python -m pip install 'ansible-core==2.18.11'
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Build Backend and Frontend; publish immutable commit tags
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          ansible-playbook -i ansible/build/inventory ansible/build/playbook.yml \
            --extra-vars "version=$IMAGE_TAG"

  deploy:
    name: Ansible production deployment
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: codeguessr-production-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
      ANSIBLE_HOST_KEY_CHECKING: "True"
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible, sshpass and Docker collection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          python -m pip install 'ansible-core==2.18.11'
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Deploy all containers with Ansible
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
        run: |
          ansible-playbook -i ansible/deploy/inventory ansible/deploy/playbook.yml \
            --extra-vars "version=$IMAGE_TAG"
