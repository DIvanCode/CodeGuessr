name: Backend CI

on:
  pull_request:
    paths:
      - "Backend/**"
      - "Frontend/**"
      - "compose.yaml"
      - "Caddyfile"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [master]
    paths:
      - "Backend/**"
      - "Frontend/**"
      - "compose.yaml"
      - "Caddyfile"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: Backend
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        working-directory: Backend
        run: python -m pytest -q
      - name: Check Docker Compose
        run: docker compose config --quiet
      - name: Start and smoke-test containers
        run: |
          docker compose up -d --build --wait
          # Caddy uses a local CA for localhost; --insecure is only for CI.
          curl --insecure --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors https://localhost/api/ping
          curl --insecure --fail --silent --show-error https://localhost/api/health/ready
          curl --insecure --fail --silent --show-error https://localhost/api/map > /dev/null
          curl --insecure --fail --silent --show-error https://localhost/ | grep -qi '<html'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
