name: codeguessr

services:
  backend:
    build: ./Backend
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app_private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 10

  frontend:
    build: ./Frontend
    restart: unless-stopped
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    networks:
      - app_private
      - public_edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - public_edge
    depends_on:
      frontend:
        condition: service_healthy

networks:
  app_private:
  public_edge:

volumes:
  caddy_data:
  caddy_config:
